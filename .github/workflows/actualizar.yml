name: Actualizar Productos de Amazon

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Ejecutar script de Scraping
        run: python script.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json
          # Si no hay cambios en productos.json, evita que falle con exit code
          git diff --quiet && git diff --staged --quiet || git commit -m "Automático: actualización de productos.json"
          git push
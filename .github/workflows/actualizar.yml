name: Actualizar Productos de Amazon

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Ejecutar script de Scraping
        run: python script.py

      - name: Guardar y subir cambios automáticamente
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automático: actualización de productos.json"
          file_pattern: 'productos.json'
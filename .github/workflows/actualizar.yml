name: Actualizar Productos de Amazon

on:
  schedule:
    # Se ejecuta automáticamente todos los días a las 00:00 y 12:00 UTC
    - cron: '0 0,12 * * *'
  # Permite ejecutarlo manualmente desde la pestaña "Actions" en GitHub
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4

      - name: Ejecutar script de Scraping
        run: python script.py

      - name: Guardar cambios en el repositorio
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add productos.json
          git commit -m "Automático: actualización de productos.json" || exit 0
          git push
name: Actualizar Productos de Amazon

on:
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Instalar librerías
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 curl_cffi

      - name: Ejecutar script de Scraping
        run: python script.py

      - name: Guardar y subir cambios automáticamente
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.json
          if ! git diff --staged --quiet; then
            git commit -m "Automático: actualización de productos.json"
            git fetch origin master
            git reset --soft origin/master
            git add productos.json
            git commit -m "Automático: actualización de productos.json"
            git push origin master
          else
            echo "Sin cambios en productos.json"
          fi